{% extends 'myapp/base.html' %}
{% load estetica %}
{% block titulo %}Editar empresa{% endblock %}

{% block contenido %}
<a href="{% url 'empresa_detalle' empresa.id %}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Volver al detalle</a>

<h3 class="mt-3 mb-4"><i class="bi bi-pencil-square"></i> Editar empresa</h3>

<form method="post" class="card card-body" style="max-width: 640px;">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" maxlength="100" value="{{ empresa.nombre }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" name="direccion" class="form-control" maxlength="200" value="{{ empresa.direccion|default:'' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">CIF</label>
        <input type="text" name="cif" class="form-control" maxlength="15" value="{{ empresa.cif }}" required>
    </div>
    <div class="mb-4">
        <label class="form-label">Teléfonos</label>
        <textarea name="telefonos" rows="4" class="form-control">{{ telefonos_texto }}</textarea>
        <div class="form-text">Uno por línea. Los que borres de acá se eliminan de la empresa.</div>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar cambios</button>
        <a href="{% url 'empresa_detalle' empresa.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
