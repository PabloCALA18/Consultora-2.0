{% extends 'myapp/base.html' %}
{% load estetica %}
{% block titulo %}Editar proyecto{% endblock %}

{% block contenido %}
<a href="{% url 'proyecto_detalle' proyecto.id %}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Volver al detalle</a>

<h3 class="mt-3 mb-4"><i class="bi bi-pencil-square"></i> Editar proyecto #{{ proyecto.id }}</h3>

<form method="post" class="card card-body" style="max-width: 640px;">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Descripción / objetivos</label>
        <textarea name="descripcion" rows="5" class="form-control" required>{{ proyecto.descripcion|default:'' }}</textarea>
    </div>
    <div class="mb-4">
        <label class="form-label">Coste</label>
        <input type="number" step="0.01" min="0" name="coste" class="form-control" value="{{ proyecto.coste|stringformat:'s' }}" required>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar cambios</button>
        <a href="{% url 'proyecto_detalle' proyecto.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
