{% extends 'myapp/base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h3 class="mb-3"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</h3>
        <form method="post" class="card card-body">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="text-center mt-3 mb-1">¿No tenés cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
        <a href="{% url 'home' %}" class="d-block text-center small">← Volver al sitio</a>
    </div>
</div>
{% endblock %}
