<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Consultora{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

{% if admin_usuario %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'inicio' %}">Consultora</a>
    <div class="navbar-nav">
        <a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}" href="{% url 'inicio' %}">Inicio</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'consultores' %}active{% endif %}" href="{% url 'consultores' %}">Consultores</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'empresas' %}active{% endif %}" href="{% url 'empresas' %}">Empresas</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'proyectos' %}active{% endif %}" href="{% url 'proyectos' %}">Proyectos</a>
    </div>
    <div class="ms-auto">
        <span class="text-white me-3">{{ admin_usuario }}</span>
        <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Salir</a>
    </div>
</nav>
{% endif %}

<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}
</div>

</body>
</html>
